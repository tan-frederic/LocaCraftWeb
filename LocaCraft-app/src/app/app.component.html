<div class="app-layout">
  <nav class="sidebar">
    <a class="sidebar-brand" routerLink="/">LocaCraft</a>
    <ul class="sidebar-nav">
      <li>
        <a class="sidebar-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          Biens immobiliers
        </a>
      </li>
      <li>
        <a class="sidebar-link" routerLink="/insee" routerLinkActive="active">
          Indices INSEE
        </a>
      </li>
      <li>
        <a class="sidebar-link" routerLink="/lessor/create" routerLinkActive="active">
          Nouveau bailleur
        </a>
      </li>
    </ul>

    <div class="sidebar-account">
      @if (accountMenuOpen) {
        <div class="account-backdrop" (click)="closeAccountMenu()"></div>
        <div class="account-menu">
          <a class="account-menu-item" routerLink="/account/settings" (click)="closeAccountMenu()">
            Paramètres du compte
          </a>
          <button class="account-menu-item account-menu-item--danger" (click)="logout()">
            Se déconnecter
          </button>
        </div>
      }
      <button class="account-btn" (click)="toggleAccountMenu()">
        <span class="account-btn-icon">&#9998;</span>
        Account
      </button>
    </div>
  </nav>

  <main class="main-content">
    <router-outlet />
  </main>
</div>
