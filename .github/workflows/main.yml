name: Deploy to VPS

on:
  push:
    tags:
      - 'push_api_dev_*'
      - 'push_api_prod_*'
      - 'push_front_dev_*'
      - 'push_front_prod_*'

jobs:
  # -----------------------------------------------
  # TESTS API
  # -----------------------------------------------
  test-api:
    if: startsWith(github.ref_name, 'push_api_')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./LocaCraftAPI/LocaCraftAPI/LocaCraftAPI.csproj

      - name: Run tests
        run: dotnet test ./LocaCraftAPI/LocaCraftAPI.Tests/LocaCraftAPI.Tests.csproj --verbosity normal

  # -----------------------------------------------
  # TESTS FRONT
  # -----------------------------------------------
  test-front:
    if: startsWith(github.ref_name, 'push_front_')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: ./LocaCraft-app

      - name: Run tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        working-directory: ./LocaCraft-app

  # -----------------------------------------------
  # DEPLOY API DEV
  # -----------------------------------------------
  deploy-api-dev:
    if: startsWith(github.ref_name, 'push_api_dev_')
    needs: test-api
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API Dev
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/LocaCraftWeb/LocaCraftAPI
            git fetch --tags origin
            git checkout ${{ github.sha }}
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build api-dev

  # -----------------------------------------------
  # DEPLOY API PROD
  # -----------------------------------------------
  deploy-api-prod:
    if: startsWith(github.ref_name, 'push_api_prod_')
    needs: test-api
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API Prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/LocaCraftWeb/LocaCraftAPI
            git fetch --tags origin
            git checkout ${{ github.sha }}
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build api-prod

  # -----------------------------------------------
  # DEPLOY FRONT DEV
  # -----------------------------------------------
  deploy-front-dev:
    if: startsWith(github.ref_name, 'push_front_dev_')
    needs: test-front
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Front Dev
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/LocaCraftWeb/LocaCraftAPI
            git fetch --tags origin
            git checkout ${{ github.sha }}
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build front-dev

  # -----------------------------------------------
  # DEPLOY FRONT PROD
  # -----------------------------------------------
  deploy-front-prod:
    if: startsWith(github.ref_name, 'push_front_prod_')
    needs: test-front
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Front Prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/${{ secrets.VPS_USER }}/LocaCraftWeb/LocaCraftAPI
            git fetch --tags origin
            git checkout ${{ github.sha }}
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build front-prod