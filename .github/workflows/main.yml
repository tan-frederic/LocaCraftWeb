name: Deploy to VPS

on:
  push:
    tags:
      - 'push_api_dev_*'
      - 'push_api_prod_*'
      - 'push_front_dev_*'
      - 'push_front_prod_*'

jobs:

  # -----------------------------------------------
  # TESTS API
  # -----------------------------------------------
  test-api:
    if: startsWith(github.ref_name, 'push_api_')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref_name, 'push_api_dev_') && 'dev' || 'main' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./LocaCraftAPI/LocaCraftAPI.csproj

      - name: Run tests
        run: dotnet test ./LocaCraftAPI.Tests/LocaCraftAPI.Tests.csproj --verbosity normal

  # -----------------------------------------------
  # TESTS FRONT
  # -----------------------------------------------
  test-front:
    if: startsWith(github.ref_name, 'push_front_')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref_name, 'push_front_dev_') && 'dev' || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci
        working-directory: ./LocaCraftFront

      - name: Run tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        working-directory: ./LocaCraftFront


  # -----------------------------------------------
  # DEPLOY API DEV
  # -----------------------------------------------
  deploy-api-dev:
    if: startsWith(github.ref_name, 'push_api_dev_')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API Dev
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/user/LocaCraftAPI
            git fetch origin
            git checkout dev_env
            git pull origin dev_env
            docker compose -f docker-compose.dev.yml up -d --build api


  # -----------------------------------------------
  # DEPLOY API PROD
  # -----------------------------------------------
  deploy-api-prod:
    if: startsWith(github.ref_name, 'push_api_prod_')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API Prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/user/LocaCraftAPI
            git fetch origin
            git checkout main
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build api


  # -----------------------------------------------
  # DEPLOY FRONT DEV
  # -----------------------------------------------
  deploy-front-dev:
    if: startsWith(github.ref_name, 'push_front_dev_')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Front Dev
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/user/LocaCraftAPI
            git fetch origin
            git checkout dev_env
            git pull origin dev_env
            docker compose -f docker-compose.dev.yml up -d --build front

  # -----------------------------------------------
  # DEPLOY FRONT PROD
  # -----------------------------------------------
  deploy-front-prod:
    if: startsWith(github.ref_name, 'push_front_prod_')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Front Prod
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/user/LocaCraftAPI
            git fetch origin
            git checkout main
            git pull origin main
            docker compose -f docker-compose.prod.yml up -d --build front

```

## Le flux avec les tests
```
git push tag push_api_prod_...
          |
     [test-api] ← checkout main, dotnet test
          |
    ✅ passent ?
     /         \
   OUI          NON
    |             |
[deploy-api-prod] ❌ deploy bloqué
    |
VPS prod mis à jour ✅