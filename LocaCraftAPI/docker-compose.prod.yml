services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locacraft}
      POSTGRES_USER: ${POSTGRES_USER:-locacraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-locacraft}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-prod:
    build:
      context: .
      dockerfile: LocaCraftAPI/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-locacraft};Username=${POSTGRES_USER:-locacraft};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: LocaCraftAPI
      Jwt__Audience: LocaCraftApp
      Jwt__ExpirationInMinutes: 60

  front-prod:
    build:
      context: ../LocaCraft-app
      dockerfile: Dockerfile
      args:
        API_URL: /api-prod
    depends_on:
      - api-prod

volumes:
  postgres_data_prod:

networks:
  default:
    name: locacraft-prod
    external: true
