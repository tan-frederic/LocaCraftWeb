services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locacraft}
      POSTGRES_USER: ${POSTGRES_USER:-locacraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-locacraft}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api-dev:
    build:
      context: .
      dockerfile: LocaCraftAPI/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-locacraft};Username=${POSTGRES_USER:-locacraft};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: LocaCraftAPI
      Jwt__Audience: LocaCraftApp
      Jwt__ExpirationInMinutes: 60

  front-dev:
    build:
      context: ../LocaCraft-app
      dockerfile: Dockerfile
      args:
        API_URL: /api-dev
    depends_on:
      - api-dev

  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ../nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - certbot-certs-dev:/etc/letsencrypt
      - certbot-www-dev:/var/www/certbot
    depends_on:
      - api-dev
      - front-dev

volumes:
  postgres_data_dev:
  certbot-certs-dev:
  certbot-www-dev:
