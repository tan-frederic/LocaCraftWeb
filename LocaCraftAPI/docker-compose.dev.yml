services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-locacraft}
      POSTGRES_USER: ${POSTGRES_USER:-locacraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-locacraft}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: LocaCraftAPI/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-locacraft};Username=${POSTGRES_USER:-locacraft};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: LocaCraftAPI
      Jwt__Audience: LocaCraftApp
      Jwt__ExpirationInMinutes: 60

  front-dev:
    build:
      context: ../LocaCraft-app
      dockerfile: Dockerfile
      args:
        API_URL: /api
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    build:
      context: ../nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - api
      - front-dev

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    command: certonly --webroot -w /var/www/certbot
      -d api.locacraft.fr
      -d app.locacraft.fr
      -d dev.locacraft.fr

volumes:
  certbot-certs:
  certbot-www:
  postgres_data:
