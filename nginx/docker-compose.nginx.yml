services:
  nginx:
    build:
      context: ../nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      certbot-init:
        condition: service_completed_successfully
    networks:
      - locacraft-dev
      - locacraft-prod
    restart: unless-stopped

  # ── Première demande de certificat ──────────────────────────────────────────
  # Ce service tourne UNE SEULE FOIS au premier déploiement, puis s'arrête.
  # Nginx doit être déjà démarré en mode bootstrap (port 80) pour que le
  # challenge HTTP-01 fonctionne — l'entrypoint.sh s'en charge.
  certbot-init:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    # Tous les sous-domaines dans une seule commande = un seul certificat SAN
    command: >
      certonly --webroot -w /var/www/certbot
      --cert-name api.locacraft.fr
      -d locacraft.fr
      -d api.locacraft.fr
      -d app.locacraft.fr
      -d apidev.locacraft.fr
      -d dev.locacraft.fr
      --email tanfrederic33@gmail.com
      --agree-tos --no-eff-email
      --keep-until-expiring
    networks:
      - locacraft-dev
      - locacraft-prod

  # ── Renouvellement automatique toutes les 12h ────────────────────────────────
  # Tourne en permanence en arrière-plan.
  # `certbot renew` ne fait rien si le certificat a encore plus de 30j de validité.
  certbot-renew:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'
    depends_on:
      certbot-init:
        condition: service_completed_successfully
    networks:
      - locacraft-dev
      - locacraft-prod
    restart: unless-stopped

volumes:
  certbot-certs:
  certbot-www:

networks:
  locacraft-dev:
    external: true
  locacraft-prod:
    external: true
