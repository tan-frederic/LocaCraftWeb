resolver 127.0.0.11 valid=30s;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name apidev.locacraft.fr dev.locacraft.fr api.locacraft.fr app.locacraft.fr;

    return 301 https://$host$request_uri;
}

# API DEV
server {
    listen 443 ssl;
    server_name apidev.locacraft.fr;

    ssl_certificate /etc/letsencrypt/live/api.locacraft.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.locacraft.fr/privkey.pem;

    location / {
        set $upstream http://api-dev:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Front DEV
server {
    listen 443 ssl;
    server_name dev.locacraft.fr;

    ssl_certificate /etc/letsencrypt/live/api.locacraft.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.locacraft.fr/privkey.pem;

    location / {
        set $upstream http://front-dev:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# API PROD
server {
    listen 443 ssl;
    server_name api.locacraft.fr;

    ssl_certificate /etc/letsencrypt/live/api.locacraft.fr/fullchain.pem;
