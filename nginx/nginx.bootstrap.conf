resolver 127.0.0.11 valid=30s;

# Bootstrap config — HTTP seulement
# Utilisée au premier démarrage, avant que le certificat Let's Encrypt existe.
# Certbot fait son challenge HTTP-01 via ce serveur, puis le vrai nginx.conf prend le relais.

server {
    listen 80;
    server_name locacraft.fr api.locacraft.fr app.locacraft.fr apidev.locacraft.fr dev.locacraft.fr;

    # Challenge Let's Encrypt — obligatoire
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste : répondre 200 le temps du bootstrap (pas de redirect HTTPS encore)
    location / {
        return 200 "Bootstrap mode — waiting for SSL certificate";
        add_header Content-Type text/plain;
    }
}
